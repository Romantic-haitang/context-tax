name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest 已于 2026-10-19 迁到 Ubuntu 26.04，而 actions/python-versions
        # 没有为 26.04 构建 3.9，setup-python 会直接报
        # "The version '3.9' with architecture 'x64' was not found for Ubuntu 26.04"。
        # 所以 3.9 这条单独钉在 24.04 上：不是降级，是不让运行器换代顺手带走一个支持的版本。
        include:
          - python: "3.9"
            os: ubuntu-24.04
          - python: "3.12"
            os: ubuntu-latest
          - python: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Byte-compile
        run: python -m compileall -q context_tax evals scripts

      - name: Evals
        run: python evals/run.py -v

      - name: SKILL.md conventions
        run: python scripts/check_skill.py

      - name: Runs on its own repo
        run: python -m context_tax . --no-color

  self-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: This repo must stay under 4% tax
        run: python -m context_tax . --fail-over 0.04 --no-color
