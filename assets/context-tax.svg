<text x="196.0" y="138" font-size="11.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,PingFang SC,Microsoft YaHei,sans-serif" fill="#636c76">The mental model almost everyone starts with — and it is wrong often enough to matter.</text>
<text x="176.0" y="179" font-size="13.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,PingFang SC,Microsoft YaHei,sans-serif" fill="#1f2328" font-weight="600" text-anchor="end">A real laptop</text>
