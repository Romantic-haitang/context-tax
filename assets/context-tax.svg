<text x="196.0" y="222" font-size="11.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,PingFang SC,Microsoft YaHei,sans-serif" fill="#636c76">Every token of resident tax is a skill description. Two doc skills share 88 words of it: 93% overlap.</text>
